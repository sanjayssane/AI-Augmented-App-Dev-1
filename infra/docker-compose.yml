services:
  postgres:
    image: postgres:15-alpine
    container_name: mcq-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mcq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcq_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-mcq_platform}
    ports:
      - "5432:5432"
    volumes:
      - mcq_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcq} -d ${POSTGRES_DB:-mcq_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mcq-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mcq-api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mcq}:${POSTGRES_PASSWORD:-mcq_dev_password}@postgres:5432/${POSTGRES_DB:-mcq_platform}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    volumes:
      - ../backend/app:/app/app
      - ../backend/tests:/app/tests
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mcq_postgres_data:
